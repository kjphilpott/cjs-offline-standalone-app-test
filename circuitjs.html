  <script>
(function setupMemorySafeCanvasTracker() {
  window.trackedCanvases = [];
  const originalGetContext = HTMLCanvasElement.prototype.getContext;

  HTMLCanvasElement.prototype.getContext = function (contextType, contextAttributes) {
    const nativeCtx = originalGetContext.call(this, contextType, contextAttributes);

    // CRITICAL MEMORY CHECK: Skip temporary, tiny offscreen buffers GWT uses for math
    const width = this.width || this.clientWidth || 0;
    const height = this.height || this.clientHeight || 0;
    
    // CircuitJS main workspace canvas is large. Ignore tiny scratchpads (under 150px)
    if (width < 150 || height < 150) {
      return nativeCtx;
    }

    if (contextType === '2d' && nativeCtx && !this.svgContext) {
      try {
        const svgCtx = new C2S(width, height);
        this.svgContext = svgCtx;

        const contextProxy = new Proxy(nativeCtx, {
          get(target, prop) {
            if (typeof target[prop] === 'function') {
              return function (...args) {
                // Keep the internal C2S vector buffer clean on refreshes
                if (prop === 'clearRect') {
                  svgCtx.clear(); 
                }

                if (typeof svgCtx[prop] === 'function') {
                  try {
                    svgCtx[prop](...args);
                  } catch (e) {}
                }
                return target[prop].apply(target, args);
              };
            }
            return target[prop];
          },
          set(target, prop, value) {
            try { svgCtx[prop] = value; } catch (e) {}
            target[prop] = value;
            return true;
          }
        });

        // Track only if it's unique and attached to the layout document
        if (!window.trackedCanvases.includes(this)) {
            window.trackedCanvases.push(this);
            console.log(`Registered main schematic node frame: ${width}x${height}`);
        }
        
        return contextProxy;
      } catch (e) {
        console.warn("Proxy safe setup error:", e);
      }
    }
    return nativeCtx;
  };
  console.log("Memory-safe canvas filter active.");
})();
 </script>

  <!-- 3. DOWNLOAD SYSTEM: Captures every canvas vector frame on Enter keydown -->
  <script>
   document.addEventListener('keydown', async function (event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    
    // Only grab valid canvases that are actively attached to the DOM right now
    const rawCanvases = window.trackedCanvases || [];
    const activeCanvases = rawCanvases.filter(c => c && document.body.contains(c));
    
    if (activeCanvases.length === 0) {
      console.warn("No active layout workspace nodes ready to bundle.");
      return;
    }

    console.log(`Zipping active canvas layers...`);
    const zip = new JSZip();
    let uniqueFileCounter = 0;

    activeCanvases.forEach((canvas, index) => {
      if (canvas.svgContext && typeof canvas.svgContext.getSerializedSvg === 'function') {
        try {
          const svgString = canvas.svgContext.getSerializedSvg(true);
          
          // Double-check string size to eliminate dead allocations
          if (!svgString || svgString.length < 500) return;

          const identifier = canvas.id || `layer-${index}`;
          zip.file(`schematics/${identifier}-${uniqueFileCounter}.svg`, svgString);
          uniqueFileCounter++;
        } catch (err) {
          console.error("Layer extraction error:", err);
        }
      });

    if (uniqueFileCounter === 0) {
      console.warn("Vector buffers were empty or below sizing thresholds.");
      return;
    }

    try {
      const zipContentBlob = await zip.generateAsync({ 
        type: "blob",
        compression: "DEFLATE",
        compressionOptions: { level: 4 } // Level 4 uses much less memory processing overhead
      });

      const blobUrl = URL.createObjectURL(zipContentBlob);
      const downloadLink = document.createElement('a');
      downloadLink.href = blobUrl;
      downloadLink.download = `circuitjs-export-${Date.now()}.zip`;

      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(blobUrl);

      console.log(`Success! Package downloaded containing only your primary ${uniqueFileCounter} schema vector files.`);
    } catch (zipError) {
      console.error("Failed to build single zip file container:", zipError);
    }
  }
});

  </script>
