  <script src="./canvas2svg.js"></script>
  <script>
    (function setupCanvasToSvgTracker() {
      window.trackedCanvases = [];
      const originalGetContext = HTMLCanvasElement.prototype.getContext;

      HTMLCanvasElement.prototype.getContext = function (contextType, contextAttributes) {
        const context = originalGetContext.call(this, contextType, contextAttributes);

        if (contextType === '2d' && context && !this.svgContext) {
          try {
            const width = this.width || this.clientWidth || 300;
            const height = this.height || this.clientHeight || 150;
            const svgCtx = new C2S(width, height);
            this.svgContext = svgCtx;

            // Proxy all 2D functions
            const methodsToProxy = Object.getOwnPropertyNames(CanvasRenderingContext2D.prototype)
              .filter(prop => typeof context[prop] === 'function');

            methodsToProxy.forEach(method => {
              const originalMethod = context[method];
              context[method] = function (...args) {
                if (typeof svgCtx[method] === 'function') {
                  svgCtx[method](...args);
                }
                return originalMethod.apply(this, args);
              };
            });

            // FIXED: Dynamically map styles and properties to match native canvas states
            const propertiesToProxy = ['fillStyle', 'strokeStyle', 'lineWidth', 'font', 'textAlign', 'textBaseline', 'globalAlpha', 'globalCompositeOperation'];
            propertiesToProxy.forEach(prop => {
              Object.defineProperty(context, prop, {
                get() {
                  // Pass back the real live internal string/value from canvas state
                  return svgCtx[prop];
                },
                set(val) {
                  // Keep both engines uniformly aligned
                  svgCtx[prop] = val;
                  // Use native style descriptors to avoid infinite recursion loops
                  const descriptor = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, prop);
                  if (descriptor && descriptor.set) {
                    descriptor.set.call(this, val);
                  } else {
                    this[prop] = val;
                  }
                },
                configurable: true
              });
            });

            window.trackedCanvases.push(this);
            console.log("Vector tracking active on CircuitJS node rendering frame.");
          } catch (e) {
            console.warn("Could not attach canvas2svg tracker:", e);
          }
        }
        return context;
      };
      console.log("Canvas context hook activated successfully.");
    })();
  </script>

  <!-- 3. DOWNLOAD SYSTEM: Captures every canvas vector frame on Enter keydown -->
  <script>
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();

        const canvases = document.querySelectorAll('canvas');
        let downloadCount = 0;

        canvases.forEach((canvas, index) => {
          if (canvas.svgContext && typeof canvas.svgContext.getSerializedSvg === 'function') {
            try {
              const svgString = canvas.svgContext.getSerializedSvg(true);
              const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
              const blobUrl = URL.createObjectURL(blob);

              const downloadLink = document.createElement('a');
              downloadLink.href = blobUrl;
              downloadLink.download = `circuit-layout-${index}-${canvas.id || 'export'}.svg`;

              document.body.appendChild(downloadLink);
              downloadLink.click();
              document.body.removeChild(downloadLink);
              URL.revokeObjectURL(blobUrl);

              downloadCount++;
            } catch (err) {
              console.error(`Error processing SVG on Canvas #${index}:`, err);
            }
          }
        });

        if (downloadCount === 0) {
          console.warn("No vectors generated yet. Make sure the simulation has rendered components on screen.");
        } else {
          console.log(`Successfully exported ${downloadCount} circuit vector files!`);
        }
      }
    });
  </script>
