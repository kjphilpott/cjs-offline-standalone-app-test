  <script>
   (function setupCanvasToSvgTracker() {
  window.trackedCanvases = [];
  const originalGetContext = HTMLCanvasElement.prototype.getContext;

  HTMLCanvasElement.prototype.getContext = function (contextType, contextAttributes) {
    // 1. Get the pure, untouched native canvas context
    const nativeCtx = originalGetContext.call(this, contextType, contextAttributes);

    if (contextType === '2d' && nativeCtx && !this.svgContext) {
      try {
        const width = this.width || this.clientWidth || 300;
        const height = this.height || this.clientHeight || 150;
        
        // 2. Initialize a clean instance of the canvas2svg tracking engine
        const svgCtx = new C2S(width, height);
        this.svgContext = svgCtx;

        // 3. Create a unified Proxy interface to safely handle both pipelines
        const contextProxy = new Proxy(nativeCtx, {
          get(target, prop) {
            // Handle method hooks (like lineTo, stroke, etc.)
            if (typeof target[prop] === 'function') {
              return function (...args) {
                // Intercept specific calls like clearRect to keep the SVG clean
                if (prop === 'clearRect') {
                  // Re-initialize or clear the shadow SVG context to prevent line stacking
                  svgCtx.clear(); 
                }

                // Safely mirror drawings to the vector engine if the method exists
                if (typeof svgCtx[prop] === 'function') {
                  try {
                    svgCtx[prop](...args);
                  } catch (e) {
                    // Fail gracefully if a method signature doesn't align perfectly
                  }
                }
                
                // Always execute the native drawing routine directly on your screen
                return target[prop].apply(target, args);
              };
            }
            
            // Pass standard properties back normally from the live canvas
            return target[prop];
          },
          
          set(target, prop, value) {
            // Synchronize drawing styles seamlessly (fillStyle, strokeStyle, lineWidth, etc.)
            try {
              svgCtx[prop] = value;
            } catch (e) {}
            
            target[prop] = value;
            return true;
          }
        });

        window.trackedCanvases.push(this);
        console.log("Clean shadow context proxy attached.");
        
        // Return our safe proxy wrapper back to CircuitJS
        return contextProxy;

      } catch (e) {
        console.warn("Could not attach canvas2svg tracker wrapper safely:", e);
      }
    }
    return nativeCtx;
  };
  console.log("Advanced canvas proxy engine activated.");
})();

  </script>

  <!-- 3. DOWNLOAD SYSTEM: Captures every canvas vector frame on Enter keydown -->
  <script>
    document.addEventListener('keydown', function (event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    
    // 1. CRITICAL CHANGE: Pull directly from our internal script registry, not the DOM
    const canvasesToExport = window.trackedCanvases || [];
    let downloadCount = 0;

    if (canvasesToExport.length === 0) {
      console.warn("No tracked canvas instances have been registered by the script yet.");
      return;
    }

    canvasesToExport.forEach((canvas, index) => {
      // 2. Double check that canvas2svg context exists and has data inside it
      if (canvas && canvas.svgContext && typeof canvas.svgContext.getSerializedSvg === 'function') {
        try {
          // Generate the vector code
          const svgString = canvas.svgContext.getSerializedSvg(true);
          
          // Verify we aren't downloading a completely blank file
          if (!svgString || svgString.length < 100) {
             console.log(`Skipped Canvas #${index} because its vector buffer was empty.`);
             return; 
          }

          // Build the automatic download asset
          const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const blobUrl = URL.createObjectURL(blob);

          const downloadLink = document.createElement('a');
          downloadLink.href = blobUrl;
          
          // Name it logically using its ID or index location
          const identifier = canvas.id || `index-${index}`;
          downloadLink.download = `circuit-complete-${identifier}.svg`;

          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(blobUrl);

          downloadCount++;
        } catch (err) {
          console.error(`Error processing SVG extraction on Canvas #${index}:`, err);
        }
      }
    });

    console.log(`Export processing finished. Triggered downloads for ${downloadCount} total canvas traces.`);
  }
});

  </script>
